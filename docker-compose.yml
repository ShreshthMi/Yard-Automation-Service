version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Frontend/yard-automation-frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    ports:
      - "8080:8080"
