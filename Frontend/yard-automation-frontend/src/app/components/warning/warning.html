<div class="warning">
  <div class="warning-header">
    <div class="speed-sign">
      <span class="speed-sign-value">{{ speedLimit() }}</span>
    </div>
    <div class="warning-heading">
      <span class="warning-title">Train Has Entered Zone 1</span>
      <span class="warning-subtitle">Reduce Speed To {{ speedLimit() }} KM/H</span>
    </div>
  </div>
  <span class="warning-divider"></span>
  <div class="warning-body">
    <span class="warning-action-label">Action Required</span>
    <ul class="warning-action-list">
      <li>Train is approaching the stop limit</li>
      <li>Reduce speed and prepare to stop</li>
    </ul>
  </div>
</div>
