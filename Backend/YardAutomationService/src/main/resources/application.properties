# Bundled defaults - the application runs with these even with no external
# properties file at all. Override with command-line args (e.g.
# --app.udp.port=9001) or with --spring.config.additional-location pointing
# at your own properties file, same as any Spring Boot property.
#
# Yard and track-section configuration is NOT here - it comes directly from
# protocol_definition.xlsx (the Yard Name / Occupied Message 1 / Occupied
# Message 2 columns on the payload-definition sheet).

app.protocol-definition-path=protocol_definition.xlsx
app.udp.port=9000

# Directory for both audit-style logs (see logback-spring.xml):
#   - track-events-YYYY-MM-DD.csv, one file per day, self-dated from the
#     moment it's created (TrackEventLogger)
#   - rejected-packets.log, rotated daily into rejected-packets.YYYY-MM-DD.log
# Defaults to the working directory; override with --app.audit-log-path=/some/dir.
app.audit-log-path=.